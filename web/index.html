<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>dmn — web terminal</title>
  <link rel="icon" href="data:," />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: sans-serif;
      background: #0f172a;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 20px;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }

    .terminal-window {
      width: 100%;
      max-width: 1200px;
      background: #1e1e1e;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .title-bar {
      background: #2d2d2d;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #1a1a1a;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .title {
      color: #e5e5e5;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls input[type="text"] {
      background: #1e1e1e;
      border: 1px solid #444;
      border-radius: 4px;
      color: #e5e5e5;
      font-size: 12px;
      padding: 4px 8px;
      width: 100px;
    }

    .controls input:disabled {
      opacity: 0.5;
    }

    .controls button {
      background: #3a3a3a;
      border: 1px solid #555;
      border-radius: 4px;
      color: #e5e5e5;
      font-size: 11px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .controls button:hover:not(:disabled) {
      background: #4a4a4a;
    }

    .controls button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .controls .readonly-label {
      color: #888;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .connection-status {
      margin-left: auto;
      font-size: 11px;
      color: #888;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .connection-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #666;
    }

    .connection-dot.connected {
      background: #27c93f;
    }

    #terminal-container {
      flex: 1;
      background: #1e1e1e;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }

    #terminal-container canvas {
      display: block;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 13px;
    }

    .loading-overlay.hidden {
      display: none;
    }

    /* Special keys toolbar */
    .key-bar {
      display: none;
      background: #2d2d2d;
      border-top: 1px solid #1a1a1a;
      padding: 6px 8px;
      gap: 4px;
      flex-shrink: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .key-bar button {
      background: #3a3a3a;
      border: 1px solid #555;
      border-radius: 4px;
      color: #e5e5e5;
      font-size: 12px;
      padding: 8px 12px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .key-bar button:active {
      background: #555;
    }

    .key-bar button.sticky {
      position: relative;
    }

    .key-bar button.sticky.active {
      background: #4a7c59;
      border-color: #27c93f;
    }

    /* Mobile styles */
    @media (max-width: 768px) {
      body {
        padding: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      .terminal-window {
        border-radius: 0;
        box-shadow: none;
        max-width: none;
      }

      .title-bar {
        padding: 8px 10px;
        gap: 6px;
      }

      .controls .readonly-label {
        display: none;
      }

      .key-bar {
        display: flex;
      }
    }

    /* Show key bar on any touch device regardless of width */
    @media (pointer: coarse) {
      .key-bar {
        display: flex;
      }
    }
  </style>
</head>

<body>
  <div class="terminal-window">
    <div class="title-bar">
      <div class="title">dmn</div>
      <div class="controls">
        <input type="text" id="session-input" placeholder="session" />
        <label class="readonly-label">
          <input type="checkbox" id="readonly-check" /> read-only
        </label>
        <button id="btn-connect">Connect</button>
        <button id="btn-disconnect" disabled>Disconnect</button>
      </div>
      <div class="connection-status">
        <span class="connection-dot" id="connection-dot"></span>
        <span id="connection-text">Disconnected</span>
      </div>
    </div>
    <div id="terminal-container">
      <div class="loading-overlay" id="loading-overlay">Loading terminal...</div>
    </div>
    <div class="key-bar" id="key-bar">
      <button data-key="esc">Esc</button>
      <button data-key="tab">Tab</button>
      <button data-sticky="ctrl" class="sticky">Ctrl</button>
      <button data-key="up">&#x2191;</button>
      <button data-key="down">&#x2193;</button>
      <button data-key="left">&#x2190;</button>
      <button data-key="right">&#x2192;</button>
    </div>
  </div>

  <script type="module">
    import { init, Terminal, FitAddon } from '/dist/ghostty-web.js';

    let term;
    let ws;
    let fitAddon;
    let autoReconnect = false;
    let reconnectTimer = null;
    let ctrlActive = false;
    let appCursorMode = false;

    const sessionInput = document.getElementById('session-input');
    const readonlyCheck = document.getElementById('readonly-check');
    const btnConnect = document.getElementById('btn-connect');
    const btnDisconnect = document.getElementById('btn-disconnect');
    const loadingOverlay = document.getElementById('loading-overlay');
    const keyBar = document.getElementById('key-bar');

    // Key map for special keys
    function resolveKey(name) {
      const prefix = appCursorMode ? '\x1bO' : '\x1b[';
      const map = {
        'esc': '\x1b',
        'tab': '\t',
        'up': prefix + 'A',
        'down': prefix + 'B',
        'right': prefix + 'C',
        'left': prefix + 'D',
      };
      return map[name] || name;
    }

    function deactivateCtrl() {
      ctrlActive = false;
      keyBar.querySelector('[data-sticky="ctrl"]').classList.remove('active');
    }

    function applyCtrl(ch) {
      const code = ch.charCodeAt(0);
      if (code >= 97 && code <= 122) return String.fromCharCode(code - 96);
      if (code >= 65 && code <= 90) return String.fromCharCode(code - 64);
      return ch;
    }

    // Special keys toolbar
    keyBar.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn || !term) return;
      if (readonlyCheck.checked) return;

      // Sticky modifier handling
      if (btn.dataset.sticky === 'ctrl') {
        ctrlActive = !ctrlActive;
        btn.classList.toggle('active', ctrlActive);
        return;
      }

      let key = resolveKey(btn.dataset.key);
      if (!key) return;

      // Apply ctrl modifier to single printable chars
      if (ctrlActive && key.length === 1) {
        key = applyCtrl(key);
        deactivateCtrl();
      }

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(key);
      }
      term.focus();
    });

    // Prevent key-bar buttons from stealing focus
    keyBar.addEventListener('mousedown', (e) => {
      if (e.target.closest('button')) e.preventDefault();
    });
    keyBar.addEventListener('touchstart', (e) => {
      if (e.target.closest('button')) e.preventDefault();
    }, { passive: false });

    async function initTerminal() {
      try {
        await init();
      } catch (e) {
        loadingOverlay.textContent = `Failed to load terminal: ${e.message}`;
        console.error('Terminal init failed:', e);
        return;
      }

      term = new Terminal({
        cursorBlink: false,
        fontSize: 14,
        theme: {
          background: '#1e1e1e',
          foreground: '#d4d4d4',
        },
        scrollback: 10000,
      });

      fitAddon = new FitAddon();
      term.loadAddon(fitAddon);

      term.open(document.getElementById('terminal-container'));
      fitAddon.fit();
      fitAddon.observeResize();

      loadingOverlay.classList.add('hidden');

      term.onResize((size) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'resize', cols: size.cols, rows: size.rows }));
        }
      });

      term.onData((data) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          if (ctrlActive && data.length === 1) {
            data = applyCtrl(data);
            deactivateCtrl();
          }
          ws.send(data);
        }
      });

      // Track application cursor mode (DECCKM) via output
      term.onWriteParsed?.(() => {});  // no-op; mode tracking below
      // Listen for mode changes in the output stream
      const origWrite = term.write.bind(term);
      term.write = function(data) {
        // Detect DECCKM set/reset: \x1b[?1h (set) / \x1b[?1l (reset)
        if (typeof data === 'string') {
          if (data.includes('\x1b[?1h')) appCursorMode = true;
          if (data.includes('\x1b[?1l')) appCursorMode = false;
        }
        return origWrite(data);
      };

      // Get default session from server
      const params = new URLSearchParams(window.location.search);
      const defaultSession = params.get('session') || sessionInput.dataset.default || 'default';
      sessionInput.value = defaultSession;

      // Auto-connect if session was provided
      if (params.get('session') || sessionInput.dataset.default) {
        connect();
      }
    }

    function connect() {
      const session = sessionInput.value.trim() || 'default';
      if (ws && ws.readyState === WebSocket.OPEN) return;

      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }

      autoReconnect = true;
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const readonly = readonlyCheck.checked ? '&readonly=1' : '';
      const wsUrl = `${protocol}//${window.location.host}/ws?session=${encodeURIComponent(session)}&cols=${term.cols}&rows=${term.rows}${readonly}`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        updateUI(true);
        term.focus();
      };

      ws.onmessage = (event) => {
        term.write(event.data);
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
      };

      ws.onclose = () => {
        updateUI(false);
        if (autoReconnect) {
          term.write('\r\n\x1b[90m[disconnected — reconnecting...]\x1b[0m\r\n');
          reconnectTimer = setTimeout(() => {
            reconnectTimer = null;
            if (autoReconnect) connect();
          }, 3000);
        }
      };
    }

    function disconnect() {
      autoReconnect = false;
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
      if (ws) {
        ws.close();
        ws = null;
      }
      updateUI(false);
      term.write('\r\n\x1b[90m[disconnected]\x1b[0m\r\n');
    }

    function updateUI(connected) {
      const dot = document.getElementById('connection-dot');
      const text = document.getElementById('connection-text');
      sessionInput.disabled = connected;
      readonlyCheck.disabled = connected;
      btnConnect.disabled = connected;
      btnDisconnect.disabled = !connected;
      if (connected) {
        dot.classList.add('connected');
        text.textContent = 'Connected';
      } else {
        dot.classList.remove('connected');
        text.textContent = 'Disconnected';
      }
    }

    btnConnect.addEventListener('click', connect);
    btnDisconnect.addEventListener('click', disconnect);
    sessionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') connect();
    });

    initTerminal();
  </script>
</body>

</html>
